ansible_user: riemann
wg_ip: "10.66.0.1"
wg_endpoint: "randazzo.ar"

# Caddy sites -- rammstein now serves ALL domains
caddy_sites:
  - domain: "randazzo.ar"
    type: static
    root: "/var/www/randazzo.ar"
  - domain: "autoplanes.randazzo.com.ar"
    type: revproxy
    target: "https://autoplanesrandazzo.framer.website"
  - domain: "randazzo.com.ar"
    type: redirect
    target: "https://randazzo.ar{uri}"
  - domain: "camaras.randazzo.ar"
    type: proxy
    backend_host: sophon
    backend_port: 8971
  - domain: "i.ar"
    type: static
    root: "/var/www/i.ar"
  # SecPlatform (sophon via WireGuard)
  - domain: "app.i.ar"
    type: proxy
    backend_host: sophon
    backend_port: 8091
  - domain: "app-bo.i.ar"
    type: proxy
    backend_host: sophon
    backend_port: 8092
  - domain: "auth.i.ar"
    type: proxy
    backend_host: sophon
    backend_port: 8080
  # Zulip (sophon via WireGuard)
  - domain: "agora.randazzo.ar"
    type: proxy
    backend_host: sophon
    backend_port: 8090

# Static sites -- both deployed by static-site role
portfolio_page_root: "/var/www/randazzo.ar"
portfolio_page_enabled: true
static_page_root: "/var/www/i.ar"
tool_static_page_enabled: true

# Git bare repos -- mirror to sophon
git_mirror_target: "git@10.66.0.5:/home/git/repos"
git_mirror_host: sophon