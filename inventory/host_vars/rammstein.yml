ansible_user: riemann
wg_ip: "10.66.0.1"
wg_endpoint: "randazzo.ar"

# Caddy sites -- rammstein now serves ALL domains
caddy_sites:
  - domain: "randazzo.ar"
    type: static
    root: "/var/www/randazzo.ar"
  - domain: "autoplanes.randazzo.com.ar"
    type: revproxy
    target: "https://autoplanesrandazzo.framer.website"
  - domain: "randazzo.com.ar"
    type: redirect
    target: "https://randazzo.ar{uri}"
  - domain: "camaras.randazzo.ar"
    type: proxy
    backend_host: sophon
    backend_port: 8971
  # Radicale (localhost on rammstein; radicale role deploys the service,
  # caddy_sites owns the Caddyfile -- blockinfile removed from role)
  - domain: "caldav.randazzo.ar"
    type: proxy
    backend_ip: "127.0.0.1"
    backend_port: 5232
  # Zulip (sophon via WireGuard)
  - domain: "agora.randazzo.ar"
    type: proxy
    backend_host: sophon
    backend_port: 8090
  # i.ar landing page (static). RE-ENABLED 2026-09-03: the new owner of
  # the i.ar product reverse-proxies to our infra for the landing page
  # (SecPlatform itself is hosted by them, see host_vars/sophon.yml).
  - domain: "i.ar"
    type: static
    root: "/var/www/i.ar"

# Static sites -- both deployed by static-site role
portfolio_page_root: "/var/www/randazzo.ar"
portfolio_page_enabled: true
# i.ar landing page -- see caddy_sites entry above.
static_page_root: "/var/www/i.ar"
tool_static_page_enabled: true

# Git bare repos -- mirror to sophon
git_mirror_target: "git@10.66.0.5:/home/git/repos"
git_mirror_host: sophon