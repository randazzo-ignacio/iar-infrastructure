ansible_user: nacho
wg_ip: "10.66.0.5"
# No wg_endpoint -- spoke, no public endpoint

# Ollama with GPU offloading
ollama_enabled: true
ollama_gpu: true
ollama_models:
  - "nemotron-3-super:120b"
  - "gpt-oss:120b"
ollama_listen: "10.66.0.5"

podman_enabled: true

# i.ar Agent Infrastructure
# Repos cloned to /var/home/nacho/repos/{i.ar,iar-personalization,gptel}
iar_agents_enabled: true
iar_ollama_host: "10.66.0.5:11434"
iar_model: "glm-5.2:cloud"
iar_ctx: 1048576
iar_agents:
  - name: librarian
    interval: "30min"
    timeout: 3600

