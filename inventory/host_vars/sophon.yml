# Git bare repos -- mirror to rammstein
git_mirror_target: "git@10.66.0.1:/home/git/repos"
git_mirror_host: rammstein

# Restic backup (2026-09-01 redesign)
# Primary: RAID1 NAS (md0 btrfs, 7.3T) -- fast, local, actually redundant.
# Offsite: rammstein, CRITICAL PATHS ONLY (frigate recordings are 76G+
# and would fill the 80G VPS disk; they stay on the NAS).
# Old NVMe primary (/home/restic/backups) retired -- same disk as the
# source data; repo migrated to the NAS. NVMe repo remains as yoga's
# sftp push target.
restic_primary_repo: "/mnt/nas/restic/backups"
restic_backup_paths:
  - /var/home/nacho/repos
  - /home/nacho/.config
  # Frigate recordings (Nacho's green light 2026-08-31) -- NAS repo only
  - /home/nacho/containers/frigate/storage
restic_remote_paths:
  - /var/home/nacho/repos
  - /home/nacho/.config
# Fail closed if the NAS is not mounted (repo would land on root disk)
restic_primary_mount: mnt-nas.mount

# SecPlatform -- DECOMMISSIONED 2026-09-01.
# The i.ar product (frontend + SecPlatform SaaS) was handed off to a friend
# who hosts it independently. We no longer host or deploy anything for i.ar.
# On sophon: sp-prod containers removed, secplatform-prod.service and
# agent-runner.service disabled. On rammstein: i.ar/app.i.ar/app-bo.i.ar/
# auth.i.ar removed from caddy_sites. Role + playbooks/secplatform.yml kept
# in the repo for history. DNS for the i.ar domains still points at
# Cloudflare -> rammstein until the new owner repoints it.
secplatform_enabled: false
secplatform_agent_runner_enabled: false
# Zulip chat server (agora.randazzo.ar)
zulip_enabled: true
zulip_external_host: "agora.randazzo.ar"
zulip_admin_email: "admin@randazzo.ar"
zulip_compose_dir: "/opt/zulip"
zulip_data_dir: "/var/lib/zulip"
zulip_http_port: 8090