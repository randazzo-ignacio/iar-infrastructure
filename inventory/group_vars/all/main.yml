# ── Domains ───────────────────────────────────────────────
# Single source of truth for domain names. Used by caddy, static-site.
# Consolidated 2026-08-04: 0b.ar dropped, i.ar moved to rammstein.
domains:
  proxy: "randzzo.ar"
  proxy_alt: "randazzo.com.ar"
  project: "i.ar"

# ── Git bare repos ─────────────────────────────────────────
# DISCOVERED DYNAMICALLY: playbooks/git-repos.yml scans ~/repos/ on the
# Ansible control node (yoga) for directories containing .git.
# To add a new repo: clone or init it in ~/repos/, re-run the playbook.
# To remove a repo: manually delete the bare repo on rammstein + sophon.
# The list below is kept for reference only (the original 7 infrastructure
# repos). It is no longer used by the git-repo role.
# git_bare_repos:
#   - finance
#   - inventory
#   - notes
#   - concepts
#   - references
#   - kicad-projects
#   - password-store

# ── WireGuard (shared) ─────────────────────────────────────
# Hub-and-spoke mesh. rammstein is the hub (wg_hub group).
# wg_network MUST be a full CIDR (e.g. 10.66.0.0/16) -- the subnet
# mask is extracted via regex in the wg0.conf template.
wg_interface: wg0
wg_port: 51820
wg_network: "10.66.0.0/16"
wg_keepalive: 25
wg_mtu: 1420

# ── Timezone ───────────────────────────────────────────────
timezone: "America/Argentina/Buenos_Aires"

# ── Essential packages ────────────────────────────────────
# Installed on all hosts by the base role.
base_packages:
  # Essential
  - git
  - curl
  - wget
  - python3
  - rsync
  - unzip
  - tar
  # Convenience
  - vim
  - tmux
  - jq
  - zstd
  # Diagnostic
  - net-tools
  - bind-utils
  # GPG and pass
  - pass
  - gnupg2
  - pinentry

# ── Shared service ports ───────────────────────────────────
# Used by multiple roles (node-exporter + monitoring)
node_exporter_port: 9100