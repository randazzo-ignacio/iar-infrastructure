---
# inventory/hosts.yml
# Functional groups define what roles run on which hosts.
# ansible_user is set per-host in host_vars (each host has a unique admin username).

all:
  children:
    cloud:
      hosts:
        daftpunk:
        rammstein:
        greenday:
    local:
      hosts:
        sophon:
        yoga:

    # ── Functional groups (hosts can belong to multiple) ────
    proxy:
      hosts:
        rammstein:
    ai_playground:
      hosts:
        greenday:
    ollama_hosts:
      hosts:
        daftpunk:
        sophon:
    frigate_hosts:
      hosts:
        sophon:

    # ── Infrastructure groups ───────────────────────────────
    wg_hub:            # WireGuard hub. Must not be empty if WG is enabled.
      hosts:
        rammstein:
    wg_peers:          # All hosts participating in the WireGuard mesh
      hosts:
        rammstein:
        daftpunk:
        greenday:
        sophon:
        yoga:
    gpu_hosts:         # NVIDIA GPU hosts (nvidia role targets this group)
      hosts:
        sophon:
    web_servers:       # Static site hosts (caddy + static-site roles)
      hosts:
        rammstein:
        daftpunk:
    monitoring:        # Prometheus + Grafana stack
      hosts:
        daftpunk: