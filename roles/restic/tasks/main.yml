---
# roles/restic/tasks/main.yml
# Sets up restic backup with multiple targets.
#
# Architecture:
#   yoga   -> local:   external drive at /mnt/backups
#          -> primary: sftp to sophon (RAID1, over WireGuard)
#          -> remote:  sftp to rammstein (offsite VPS)
#   sophon -> primary: local disk (/home/restic/backups)
#          -> remote:  sftp to rammstein (offsite)
#   rammstein -> SFTP target only (no local backups)
#
# SSH access: the ansible user's authorized_keys are copied to the restic
# user on rammstein AND sophon. No separate keys -- same rationale as git-repo role.
#
# The restic user's shell is set to the SFTP server binary directly.
# This avoids ForceCommand internal-sftp, which triggers an SELinux
# domain transition to sftpd_t that is locked down on Fedora. By making
# the shell BE the SFTP server, no ForceCommand is needed and no
# domain transition occurs.
#
# The systemd service backs up to ALL targets in one run.
# A weekly check verifies repository integrity.
# Retention policy prunes old snapshots after each backup.

# -- Install restic --
- name: Install restic
  dnf:
    name: restic
    state: present

# ============================================================
# LOCAL DRIVE SETUP (yoga -- optional external drive)
# ============================================================

- name: Ensure local backup mountpoint exists
  file:
    path: "{{ restic_local_mountpoint }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - restic_local_repo is defined
    - restic_local_repo | length > 0

- name: Format local backup drive (first run only)
  command: "mkfs.ext4 -L backups {{ restic_local_device }}"
  when:
    - restic_local_repo is defined
    - restic_local_repo | length > 0
    - restic_format_local_drive | default(false) | bool

- name: Get UUID of local backup drive
  command: "blkid -s UUID -o value {{ restic_local_device }}"
  register: local_drive_uuid
  changed_when: false
  when:
    - restic_local_repo is defined
    - restic_local_repo | length > 0

- name: Mount local backup drive via fstab
  mount:
    path: "{{ restic_local_mountpoint }}"
    src: "UUID={{ local_drive_uuid.stdout }}"
    fstype: ext4
    opts: defaults,noatime
    state: mounted
  when:
    - restic_local_repo is defined
    - restic_local_repo | length > 0

- name: Ensure restic directory exists on local drive
  file:
    path: "{{ restic_local_mountpoint }}/restic"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'
  when:
    - restic_local_repo is defined
    - restic_local_repo | length > 0

- name: Initialize restic repo on local drive
  command: "{{ restic_binary }} --repo {{ restic_local_repo }} init"
  args:
    creates: "{{ restic_local_mountpoint }}/restic/config"
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  become_user: "{{ ansible_user }}"
  when:
    - restic_local_repo is defined
    - restic_local_repo | length > 0

# ============================================================
# CLIENT-SIDE SETUP (yoga, sophon -- hosts that run backups)
# ============================================================

# -- Password file --
- name: Set restic password file path
  set_fact:
    restic_password_file: "/home/{{ ansible_user }}/.config/restic-password"
  when: restic_backup_paths | length > 0

- name: Ensure config directory exists
  file:
    path: "/home/{{ ansible_user }}/.config"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'
  when: restic_backup_paths | length > 0

- name: Create restic password file
  copy:
    dest: "{{ restic_password_file }}"
    content: "{{ restic_password }}\n"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  when: restic_backup_paths | length > 0

# ============================================================
# SERVER-SIDE SETUP (rammstein + sophon -- SFTP targets)
# Both rammstein and sophon receive SFTP backups from yoga.
# Sophon also uses /home/restic/backups locally for its own backups.
# ============================================================

# -- Add SFTP server to /etc/shells so it's accepted as a valid shell --
- name: Ensure SFTP server binary is in /etc/shells
  lineinfile:
    path: /etc/shells
    line: "/usr/libexec/openssh/sftp-server"
    state: present
  when: inventory_hostname in ['rammstein', 'sophon']

- name: Create restic user on SFTP target hosts
  user:
    name: restic
    shell: "/usr/libexec/openssh/sftp-server"
    home: "/home/restic"
    system: true
    create_home: true
  when: inventory_hostname in ['rammstein', 'sophon']

- name: Ensure restic backup directory exists on SFTP target hosts
  file:
    path: "/home/restic/backups"
    state: directory
    owner: restic
    group: restic
    mode: '0700'
  when: inventory_hostname in ['rammstein', 'sophon']

- name: Ensure .ssh directory exists for restic user on SFTP target hosts
  file:
    path: "/home/restic/.ssh"
    state: directory
    owner: restic
    group: restic
    mode: '0700'
  when: inventory_hostname in ['rammstein', 'sophon']

- name: Copy ansible user's authorized_keys to restic user on SFTP target hosts
  slurp:
    path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
  register: ansible_auth_keys
  when: inventory_hostname in ['rammstein', 'sophon']

- name: Authorize ansible keys for restic user on SFTP target hosts
  copy:
    dest: "/home/restic/.ssh/authorized_keys"
    content: "{{ ansible_auth_keys['content'] | b64decode }}"
    owner: restic
    group: restic
    mode: '0600'
  when: inventory_hostname in ['rammstein', 'sophon']

- name: Initialize restic repo on SFTP target hosts
  command: "{{ restic_binary }} --repo /home/restic/backups init"
  args:
    creates: "/home/restic/backups/config"
  become_user: restic
  environment:
    RESTIC_PASSWORD: "{{ restic_password }}"
  when: inventory_hostname in ['rammstein', 'sophon']

# ============================================================
# SFTP PUSH PREREQUISITES (client hosts only)
# The backup service runs as root and pushes to the remote repo
# via sftp. Root needs: an ssh key authorized on the target, and
# the target host key in known_hosts. Without these the nightly
# service fails silently (host key verification / permission denied).
# ============================================================

- name: Generate root ssh key for restic sftp push (if missing)
  community.crypto.openssh_keypair:
    path: /root/.ssh/id_ed25519
    type: ed25519
    comment: "restic@{{ inventory_hostname }}"
    force: false
  when: restic_backup_paths | length > 0

- name: Check if root push key exists
  stat:
    path: /root/.ssh/id_ed25519.pub
  register: restic_push_key_stat
  when: restic_backup_paths | length > 0

- name: Read root public key for restic push
  slurp:
    path: /root/.ssh/id_ed25519.pub
  register: restic_push_pubkey
  when:
    - restic_backup_paths | length > 0
    - restic_push_key_stat.stat.exists

- name: Authorize root push key on SFTP target hosts
  ansible.posix.authorized_key:
    user: restic
    key: "{{ restic_push_pubkey.content | b64decode }}"
    state: present
  delegate_to: "{{ restic_remote_host }}"
  when:
    - restic_backup_paths | length > 0
    - restic_remote_host is defined
    - restic_push_pubkey.content is defined
  ignore_errors: true

- name: Scan target host key
  command: "ssh-keyscan -t ed25519 {{ restic_remote_host_ip }}"
  register: restic_host_key_scan
  changed_when: false
  failed_when: false
  when:
    - restic_backup_paths | length > 0
    - restic_remote_host_ip is defined

- name: Add target host key to root known_hosts (idempotent lineinfile)
  ansible.builtin.lineinfile:
    path: /root/.ssh/known_hosts
    line: "{{ restic_host_key_scan.stdout_lines[0] }}"
    state: present
    create: true
  when:
    - restic_backup_paths | length > 0
    - restic_remote_host_ip is defined
    - restic_host_key_scan.stdout_lines | length > 0

# ============================================================
# SYSTEMD SERVICES + TIMERS (client hosts only)
# ============================================================

- name: Deploy restic backup service
  template:
    src: restic-backup.service.j2
    dest: /etc/systemd/system/restic-backup.service
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd
  when: restic_backup_paths | length > 0

- name: Deploy restic backup timer
  template:
    src: restic-backup.timer.j2
    dest: /etc/systemd/system/restic-backup.timer
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd
  when: restic_backup_paths | length > 0

- name: Deploy restic check service
  template:
    src: restic-check.service.j2
    dest: /etc/systemd/system/restic-check.service
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd
  when: restic_backup_paths | length > 0

- name: Deploy restic check timer
  template:
    src: restic-check.timer.j2
    dest: /etc/systemd/system/restic-check.timer
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd
  when: restic_backup_paths | length > 0

# -- Enable and start timers --
- name: Enable restic backup timer
  service:
    name: restic-backup.timer
    state: started
    enabled: true
  when: restic_backup_paths | length > 0

- name: Enable restic check timer
  service:
    name: restic-check.timer
    state: started
    enabled: true
  when: restic_backup_paths | length > 0