---
# roles/pass/tasks/main.yml
# Installs pass (standard Unix password manager) and initializes the
# password store with GPG encryption + git version control.
#
# pass is used as a password book / DRP, not an autofill system.
# No browser extension, no mobile sync -- just `pass show <entry>`.
# The git repo is backed up to self-hosted bare repos on rammstein + sophon.
#
# This role runs on yoga only (daily driver, where Nacho looks up passwords).
# The password-store bare repo on rammstein/sophon is created by git-repo role.

# -- Resolve per-host GPG key ID --
- name: Resolve GPG key ID for this host
  set_fact:
    pass_local_gpg_id: "{{ pass_gpg_id[inventory_hostname] | default('') }}"

# -- Install pass + gnupg --
- name: Install pass and GnuPG
  dnf:
    name:
      - pass
      - gnupg2
      - pinentry
    state: present
  when: manage_packages | default(true) | bool

# -- Initialize password store --
# Only run if GPG key ID is set AND ~/.password-store doesn't exist yet.
# If the store already exists (cloned from remote), skip init.
- name: Check if password store already exists
  stat:
    path: "~/.password-store/.gpg-id"
  register: pass_store
  become: false

- name: Initialize password store with GPG key
  command: "pass init {{ pass_local_gpg_id }}"
  args:
    creates: "~/.password-store/.gpg-id"
  become: false
  when:
    - pass_local_gpg_id | length > 0
    - not pass_store.stat.exists

# -- Configure git for the password store --
- name: Configure git identity for password store
  git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: local
    repo: "~/.password-store"
  loop:
    - { name: "user.name", value: "{{ pass_git_name }}" }
    - { name: "user.email", value: "{{ pass_git_email }}" }
  become: false
  when:
    - pass_local_gpg_id | length > 0
    - not pass_store.stat.exists

# -- Initialize git in the password store --
- name: Initialize git in password store
  command: "pass git init"
  args:
    creates: "~/.password-store/.git"
  become: false
  when:
    - pass_local_gpg_id | length > 0
    - not pass_store.stat.exists

# -- Add remotes --
# Both rammstein and sophon have the password-store bare repo (from git-repo role).
# origin = rammstein (primary, auto-mirrors to sophon via post-receive hook).
# sophon = secondary remote (can push directly if rammstein is down).
- name: Add git remotes to password store
  command: "pass git remote add {{ item.key }} {{ item.value }}"
  args:
    chdir: "~/.password-store"
  loop: "{{ pass_git_remotes | dict2items }}"
  become: false
  when:
    - pass_local_gpg_id | length > 0
    - not pass_store.stat.exists
  ignore_errors: true  # remote may already exist

- name: Set origin to rammstein (primary remote)
  command: "pass git remote set-url origin {{ pass_git_remotes.rammstein }}"
  args:
    chdir: "~/.password-store"
  become: false
  when:
    - pass_local_gpg_id | length > 0
    - not pass_store.stat.exists

# -- Initial commit + push --
- name: Initial commit of password store
  command: "pass git commit -m 'Initial password store' --allow-empty"
  args:
    chdir: "~/.password-store"
  become: false
  when:
    - pass_local_gpg_id | length > 0
    - not pass_store.stat.exists

- name: Push password store to remotes
  command: "pass git push -u origin main"
  args:
    chdir: "~/.password-store"
  become: false
  when:
    - pass_local_gpg_id | length > 0
    - not pass_store.stat.exists
  ignore_errors: true  # remote may not be reachable yet