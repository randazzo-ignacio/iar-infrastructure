---
# roles/base/tasks/main.yml
# Applied to every host -- hardening, packages, SSH, firewall, sysctl.
# Yoga (Fedora Silverblue) excludes package management via manage_packages: false.

# -- System update --
- name: Update all packages
  dnf:
    name: "*"
    state: latest
  when: manage_packages | default(true) | bool

# -- Essential packages --
- name: Install essential packages
  dnf:
    name: "{{ base_packages }}"
    state: present
  when: manage_packages | default(true) | bool

# -- Timezone --
- name: Set timezone
  timezone:
    name: "{{ timezone }}"

# -- SSH hardening --
- name: Configure sshd
  template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0644'
    validate: 'sshd -t -f %s'
  notify: restart sshd

# -- Firewall (firewalld) --
- name: Ensure firewalld is installed
  dnf:
    name: firewalld
    state: present
  when: manage_packages | default(true) | bool

- name: Ensure firewalld is running
  service:
    name: firewalld
    state: started
    enabled: true

- name: Allow SSH through firewalld
  ansible.posix.firewalld:
    port: "{{ ssh_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true

# -- Automatic security updates --
- name: Install dnf-automatic
  dnf:
    name: dnf-automatic
    state: present
  when: manage_packages | default(true) | bool

- name: Enable dnf-automatic timer
  service:
    name: dnf-automatic.timer
    state: started
    enabled: true
  when: manage_packages | default(true) | bool

# -- Sysctl hardening --
- name: Apply sysctl hardening
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ base_sysctl_settings }}"