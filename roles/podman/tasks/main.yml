---
# roles/podman/tasks/main.yml
# Installs Podman on all hosts. EPEL required for non-Fedora RHEL family.
# manage_packages: false can be set per-host for non-dnf systems.

- name: Install EPEL (non-Fedora only)
  dnf:
    name: epel-release
    state: present
  when:
    - ansible_facts["distribution"] != "Fedora"
    - manage_packages | default(true) | bool

- name: Install Podman
  dnf:
    name: podman
    state: present
  when: manage_packages | default(true) | bool

- name: Enable and start Podman
  service:
    name: podman
    state: started
    enabled: true