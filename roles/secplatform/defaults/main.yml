---
# roles/secplatform/defaults/main.yml

# Enable flag -- opt-in, fail closed.
secplatform_enabled: false

# Repo to clone.
secplatform_repo_url: ""
secplatform_repo_branch: "main"

# Deploy directory on the target host.
secplatform_deploy_dir: ""

# Environment to deploy (prod, dev, local).
secplatform_env: "prod"

# Compose project name (namespaces containers and volumes).
secplatform_compose_project: "sp-{{ secplatform_env }}"

# User that owns the deploy directory and runs podman compose.
secplatform_user: "{{ ansible_user }}"

# Podman compose binary. podman v4+ includes compose subcommand.
secplatform_compose_cmd: "podman compose"

# Whether to force a rebuild of images on every Ansible run.
secplatform_rebuild: false

# -- .env configuration (replaces setup.sh) --
# Host IP for .env (not critical for prod -- URLs are hardcoded in compose overrides).
secplatform_host_ip: "127.0.0.1"

# UID:GID for podman volume ownership.
secplatform_uid_gid: "1000:1000"

# Tenant passwords (override in vault for production).
secplatform_tenant_acme_password: "acme-tenant-poc-secret"
secplatform_tenant_globex_password: "globex-tenant-poc-secret"

# Seed tenants -- must match keycloak realm JSONs and postgres init scripts.
secplatform_tenants:
  - acme
  - globex

# Postgres init scripts to chmod +x.
secplatform_pg_init_scripts:
  - 01-create-databases.sh