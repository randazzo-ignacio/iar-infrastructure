---
# roles/secplatform/tasks/main.yml
# Deploys SecPlatform (multi-tenant SaaS) via podman compose.
# Prerequisites: podman role must run first (installs podman).
#
# This role clones the repo, creates .env + tenant directories,
# installs docker-compose v2 (for proper depends_on + healthcheck support),
# enables podman sockets (Docker-compatible API for docker-compose v2),
# and starts the stack as a systemd service.

# -- Validate required variables --
- name: Fail if secplatform_repo_url is not set
  fail:
    msg: "secplatform_repo_url must be set in host_vars"
  when: secplatform_repo_url | length == 0

- name: Fail if secplatform_deploy_dir is not set
  fail:
    msg: "secplatform_deploy_dir must be set in host_vars"
  when: secplatform_deploy_dir | length == 0

# -- Install docker-compose v2 (Go binary) --
# podman-compose (Python) doesn't support depends_on with
# condition: service_healthy. docker-compose v2 does, and
# podman compose will use it as the provider if found in PATH.
- name: Check if docker-compose v2 is installed
  command: "docker-compose version --short"
  register: dc_check
  changed_when: false
  failed_when: false

- name: Install docker-compose v2
  get_url:
    url: "https://github.com/docker/compose/releases/download/v{{ secplatform_compose_version }}/docker-compose-linux-{{ ansible_architecture }}"
    dest: "/usr/local/bin/docker-compose"
    mode: '0755'
    owner: root
    group: root
  when: dc_check.rc != 0

- name: Verify docker-compose v2 is working
  command: "docker-compose version --short"
  changed_when: false

# -- Enable podman sockets --
# docker-compose v2 connects via Docker-compatible socket API.
# Podman provides this via podman.socket (systemd socket activation).
# System socket: for the systemd service (runs as root).
# User socket: for manual commands and the rebuild task.
- name: Enable system podman socket
  systemd:
    name: podman.socket
    state: started
    enabled: true

- name: Enable user podman socket (for manual spc.sh usage)
  systemd:
    name: podman.socket
    state: started
    enabled: true
    scope: user
  become: true
  become_user: "{{ secplatform_user }}"

# -- Clone or update the repo --
- name: Ensure deploy directory parent exists
  file:
    path: "{{ secplatform_deploy_dir | dirname }}"
    state: directory
    owner: "{{ secplatform_user }}"
    group: "{{ secplatform_user }}"
    mode: '0755'

- name: Clone SecPlatform repo
  git:
    repo: "{{ secplatform_repo_url }}"
    dest: "{{ secplatform_deploy_dir }}"
    version: "{{ secplatform_repo_branch }}"
    force: true
  become: true
  become_user: "{{ secplatform_user }}"
  register: secplatform_repo_update

# -- Create .env (replaces setup.sh, non-interactive) --
- name: Check if .env exists
  stat:
    path: "{{ secplatform_deploy_dir }}/.env"
  register: secplatform_env_file

- name: Create .env
  copy:
    dest: "{{ secplatform_deploy_dir }}/.env"
    content: |
      HOST_IP={{ secplatform_host_ip | default('127.0.0.1') }}
      KEYCLOAK_PUBLIC_URL=https://auth.i.ar
      CLIENT_PORTAL_URL=https://app.i.ar/
      UID_GID={{ secplatform_uid_gid | default('1000:1000') }}
      TENANT_ACME_DB_PASSWORD={{ secplatform_tenant_acme_password | default('acme-tenant-poc-secret') }}
      TENANT_GLOBEX_DB_PASSWORD={{ secplatform_tenant_globex_password | default('globex-tenant-poc-secret') }}
    owner: "{{ secplatform_user }}"
    group: "{{ secplatform_user }}"
    mode: '0644'
  become: true
  become_user: "{{ secplatform_user }}"
  when: not secplatform_env_file.stat.exists

# -- Create tenant directories (replaces setup.sh) --
- name: Create tenant directories
  file:
    path: "{{ secplatform_deploy_dir }}/tenants/{{ item.0 }}/{{ item.1 }}"
    state: directory
    owner: "{{ secplatform_user }}"
    group: "{{ secplatform_user }}"
    mode: '0755'
  become: true
  become_user: "{{ secplatform_user }}"
  loop: "{{ secplatform_tenants | product(['assets', 'vpns', 'findings', 'evidence', 'secrets', 'audit', 'jobs/queued', 'jobs/claimed', 'jobs/running', 'jobs/completed', 'jobs/failed']) | list }}"
  when: not secplatform_env_file.stat.exists

- name: Create tenant manifest files
  copy:
    dest: "{{ secplatform_deploy_dir }}/tenants/{{ item }}/tenant.json"
    content: "{\"tenant_id\":\"{{ item }}\"}"
    owner: "{{ secplatform_user }}"
    group: "{{ secplatform_user }}"
    mode: '0644'
  become: true
  become_user: "{{ secplatform_user }}"
  loop: "{{ secplatform_tenants }}"
  when: not secplatform_env_file.stat.exists

# -- Make scripts executable (git may have lost the mode) --
- name: Ensure scripts are executable
  file:
    path: "{{ secplatform_deploy_dir }}/{{ item }}"
    mode: '0755'
  loop:
    - spc.sh
    - reset.sh
    - test-e2e.sh
  become: true
  become_user: "{{ secplatform_user }}"

- name: Ensure postgres init scripts are executable
  file:
    path: "{{ secplatform_deploy_dir }}/postgres/init/{{ item }}"
    mode: '0755'
  loop: "{{ secplatform_pg_init_scripts | default([]) }}"
  become: true
  become_user: "{{ secplatform_user }}"

# -- Create systemd service --
# Runs as root (system service). Uses DOCKER_HOST to point docker-compose v2
# at the podman system socket.
- name: Deploy SecPlatform systemd service
  copy:
    dest: "/etc/systemd/system/secplatform-{{ secplatform_env }}.service"
    content: |
      [Unit]
      Description=SecPlatform {{ secplatform_env }} (podman compose)
      After=network-online.target podman.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory={{ secplatform_deploy_dir }}
      Environment=COMPOSE_PROJECT_NAME={{ secplatform_compose_project }}
      Environment=DOCKER_HOST=unix:///run/podman/podman.sock
      ExecStart=/usr/bin/podman compose -f docker-compose.yml -f compose/ports.{{ secplatform_env }}.yml -f compose/env.{{ secplatform_env }}.yml up -d
      ExecStop=/usr/bin/podman compose -f docker-compose.yml -f compose/ports.{{ secplatform_env }}.yml -f compose/env.{{ secplatform_env }}.yml down

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: '0644'
  notify: restart secplatform

# -- Enable and start --
- name: Enable and start SecPlatform
  service:
    name: "secplatform-{{ secplatform_env }}"
    state: started
    enabled: true

# -- Rebuild images if requested --
# Runs as root to match the systemd service (root podman context).
# The containers and images live in the root podman storage.
- name: Rebuild SecPlatform images
  command: "/usr/bin/podman compose -f docker-compose.yml -f compose/ports.{{ secplatform_env }}.yml -f compose/env.{{ secplatform_env }}.yml up -d --build"
  args:
    chdir: "{{ secplatform_deploy_dir }}"
  environment:
    COMPOSE_PROJECT_NAME: "{{ secplatform_compose_project }}"
    DOCKER_HOST: "unix:///run/podman/podman.sock"
  when: secplatform_rebuild | bool
  notify: restart secplatform