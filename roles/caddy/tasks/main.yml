---
# roles/caddy/tasks/main.yml
# Installs Caddy on web_servers. Each host gets a data-driven Caddyfile
# generated from its caddy_sites list (defined in host_vars).

# -- Install Caddy --
- name: Add Caddy COPR repo
  dnf:
    name: "@caddy/caddy"
    state: present

- name: Install Caddy
  dnf:
    name: caddy
    state: present

# -- Configure Caddy --
- name: Deploy Caddyfile
  template:
    src: Caddyfile.j2
    dest: "{{ caddy_config_path }}"
    owner: root
    group: root
    mode: '0644'
  notify: reload caddy

# -- Firewall --
- name: Check if firewalld is running
  command: systemctl is-active firewalld
  register: caddy_firewalld_status
  changed_when: false
  failed_when: false

- name: Allow HTTP through firewalld
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true
  when: caddy_firewalld_status.stdout == 'active'

- name: Allow HTTPS through firewalld
  ansible.posix.firewalld:
    service: https
    permanent: true
    state: enabled
    immediate: true
  when: caddy_firewalld_status.stdout == 'active'

# -- Enable Caddy --
- name: Enable and start Caddy
  service:
    name: caddy
    state: started
    enabled: true