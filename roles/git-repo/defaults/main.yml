---
# roles/git-repo/defaults/main.yml

# Where to create bare repos on the target host
git_repo_root: "/home/git/repos"

# User that owns the bare repos (and that clients SSH as to push/pull)
git_repo_user: "git"

# List of repo names to create (without .git suffix)
# Defined in group_vars/all/main.yml (single source of truth)
git_bare_repos: []

# SSH authorized keys: copied from the ansible user's authorized_keys.
# No separate keys -- the ansible key already has full access to the host.
git_authorized_keys: []

# Mirror configuration -- set on BOTH hosts if mirroring is desired.
# Each host pushes to the other via post-receive hook.
# Format: user@host:path  (use WG IP, not DNS)
# On rammstein: git_mirror_target: "git@10.66.0.5:/home/git/repos"
# On sophon:    git_mirror_target: "git@10.66.0.1:/home/git/repos"
# Leave empty to disable mirroring.
git_mirror_target: ""