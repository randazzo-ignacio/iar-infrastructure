---
# roles/git-repo/tasks/main.yml
# Creates bare git repos on a host, accessible over SSH via git-shell.
# Deployed on rammstein (primary) and sophon (mirror).
#
# SSH access: the ansible user's authorized_keys are copied to the git
# user. No separate SSH keys -- if the ansible key is compromised, everything
# else is too. Separate keys add complexity without adding security.
#
# Mirror access: the git user gets its own SSH keypair for pushing to
# the mirror target. Each host's git public key is added to the other
# host's git authorized_keys. The mirror target's host key is pre-populated
# in the git user's known_hosts to avoid interactive host key verification.
#
# Topology: clients push to either host. Each host has a post-receive
# hook that mirrors to the other. If one is down, the mirror hook
# silently fails (|| true) and catches up on next push.

# -- Create git user --
- name: Create git user
  user:
    name: "{{ git_repo_user }}"
    shell: /usr/bin/git-shell
    home: "{{ git_repo_root }}"
    system: false
    create_home: true

# -- Ensure repo root exists --
- name: Ensure repo root exists
  file:
    path: "{{ git_repo_root }}"
    state: directory
    owner: "{{ git_repo_user }}"
    group: "{{ git_repo_user }}"
    mode: '0755'

# -- Copy ansible user's authorized_keys to git user --
- name: Read ansible user's authorized_keys
  slurp:
    path: "/home/{{ ansible_user }}/.ssh/authorized_keys"
  register: ansible_auth_keys

- name: Ensure .ssh directory exists for git user
  file:
    path: "{{ git_repo_root }}/.ssh"
    state: directory
    owner: "{{ git_repo_user }}"
    group: "{{ git_repo_user }}"
    mode: '0700'

- name: Authorize ansible keys for git user
  copy:
    dest: "{{ git_repo_root }}/.ssh/authorized_keys"
    content: "{{ ansible_auth_keys['content'] | b64decode }}"
    owner: "{{ git_repo_user }}"
    group: "{{ git_repo_user }}"
    mode: '0600'

# -- Generate SSH keypair for git user (for mirror pushes) --
- name: Generate SSH key for git user
  openssh_keypair:
    path: "{{ git_repo_root }}/.ssh/id_ed25519"
    type: ed25519
    owner: "{{ git_repo_user }}"
    group: "{{ git_repo_user }}"
    comment: "git-mirror@{{ inventory_hostname }}"
  register: git_ssh_key

- name: Read git user's public key
  slurp:
    path: "{{ git_repo_root }}/.ssh/id_ed25519.pub"
  register: git_public_key

# -- Add this host's git key to the mirror target's authorized_keys --
# Uses delegate_to to run on the mirror host (by inventory name, not SSH alias).
# The ansible user on the mirror host has sudo, so this works.
- name: Add this host's git key to mirror target
  authorized_key:
    user: "{{ git_repo_user }}"
    key: "{{ git_public_key['content'] | b64decode }}"
    state: present
  delegate_to: "{{ git_mirror_host }}"
  when:
    - git_mirror_target | length > 0
    - git_mirror_host is defined

# -- Pre-populate known_hosts for the mirror target --
# The post-receive hook runs non-interactively as the git user.
# Without the mirror target's host key in known_hosts, SSH fails
# with "Host key verification failed" because it can't prompt.
- name: Scan mirror target host key
  command: "ssh-keyscan -H {{ git_mirror_target.split('@')[1].split(':')[0] }}"
  register: git_mirror_hostkey
  changed_when: false
  when:
    - git_mirror_target | length > 0
    - git_mirror_host is defined

- name: Add mirror target to git user's known_hosts
  copy:
    dest: "{{ git_repo_root }}/.ssh/known_hosts"
    content: "{{ git_mirror_hostkey.stdout }}"
    owner: "{{ git_repo_user }}"
    group: "{{ git_repo_user }}"
    mode: '0600'
  when:
    - git_mirror_target | length > 0
    - git_mirror_host is defined

# -- Create bare repos --
- name: Create bare repo directories
  file:
    path: "{{ git_repo_root }}/{{ item }}.git"
    state: directory
    owner: "{{ git_repo_user }}"
    group: "{{ git_repo_user }}"
    mode: '0755'
  loop: "{{ git_bare_repos }}"

- name: Initialize bare repos
  command: "git init --bare {{ git_repo_root }}/{{ item }}.git"
  args:
    creates: "{{ git_repo_root }}/{{ item }}.git/HEAD"
  become_user: "{{ git_repo_user }}"
  loop: "{{ git_bare_repos }}"

# -- Configure mirroring via post-receive hook --
# Each host mirrors to the other. If the mirror target is unreachable,
# the hook fails silently. Next successful push catches up.
- name: Configure post-receive mirror hook
  copy:
    dest: "{{ git_repo_root }}/{{ item }}.git/hooks/post-receive"
    content: |
      #!/bin/bash
      # Auto-mirror to {{ git_mirror_target }} (if configured)
      if [ -n "{{ git_mirror_target }}" ]; then
        git push --quiet {{ git_mirror_target }}/{{ item }}.git --all 2>/dev/null || true
        git push --quiet {{ git_mirror_target }}/{{ item }}.git --tags 2>/dev/null || true
      fi
    owner: "{{ git_repo_user }}"
    group: "{{ git_repo_user }}"
    mode: '0755'
  loop: "{{ git_bare_repos }}"
  when: git_mirror_target | length > 0
# -- Post-receive hook root guard (2026-09-01, aria cycle 74) --
# File-path pushes to the bare run as root (root owns the clone on sophon).
# Root has no key on the mirror target; the git user does. Re-exec the
# mirror push as the git user so the mirror leg actually fires.
- name: Patch post-receive hook to re-exec mirror as git user when root
  ansible.builtin.lineinfile:
    path: "{{ git_repo_root }}/{{ item }}.git/hooks/post-receive"
    insertafter: "^#!/bin/bash"
    line: |
      if [ "$(id -u)" -eq 0 ]; then
        exec runuser -u git -- /usr/bin/env GIT_DIR="$(pwd)" git push --quiet {{ git_mirror_target }}/$(basename "$(pwd)") --all 2>/dev/null || true
      fi
    firstmatch: true
  loop: "{{ git_bare_repos }}"
  when: git_mirror_target | length > 0
