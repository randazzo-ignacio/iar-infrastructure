---
# roles/radicale/tasks/main.yml
# Installs and configures Radicale (CalDAV server) on rammstein.
#
# Architecture:
#   Phone/Laptop -> https://caldav.randazzo.ar (Caddy, TLS + basic auth)
#                   -> localhost:5232 (Radicale)
#
# Radicale binds to localhost only. Caddy is the public entry point.
# Calendar data is backed up to the notes git bare repo via systemd timer.
#
# Fedora packages Radicale 3 as 'radicale3'. The binary is /usr/bin/radicale3.
# The package creates a 'radicale' system user and group.

# -- Install Radicale + httpd-tools (for htpasswd) --
- name: Install Radicale and httpd-tools
  dnf:
    name:
      - "{{ radicale_package }}"
      - httpd-tools
    state: present

# -- Ensure directories exist --
- name: Ensure config directory exists
  file:
    path: "{{ radicale_config_dir }}"
    state: directory
    owner: root
    group: radicale
    mode: '0750'

- name: Ensure data directory exists
  file:
    path: "{{ radicale_data_dir }}"
    state: directory
    owner: radicale
    group: radicale
    mode: '0750'

# -- Generate htpasswd file for authentication --
- name: Generate htpasswd file
  command: "htpasswd -bcB {{ radicale_config_dir }}/users {{ radicale_username }} {{ radicale_password }}"
  no_log: true
  changed_when: false

- name: Set htpasswd file permissions
  file:
    path: "{{ radicale_config_dir }}/users"
    owner: root
    group: radicale
    mode: '0640'

# -- Deploy Radicale config --
- name: Deploy Radicale config
  template:
    src: config.j2
    dest: "{{ radicale_config_dir }}/config"
    owner: root
    group: radicale
    mode: '0640'
  notify: restart radicale

# -- Deploy systemd service --
- name: Deploy Radicale systemd service
  template:
    src: radicale.service.j2
    dest: /etc/systemd/system/radicale.service
    owner: root
    group: root
    mode: '0644'
  notify: restart radicale

# -- Enable and start Radicale --
- name: Enable and start Radicale
  service:
    name: radicale
    state: started
    enabled: true
    daemon_reload: true

# -- Add Caddy reverse proxy for Radicale --
- name: Add Radicale site to Caddy
  blockinfile:
    path: "{{ caddy_config_path }}"
    marker: "# {mark} ANSIBLE MANAGED -- Radicale"
    block: |
      {{ radicale_domain }} {
          reverse_proxy {{ radicale_host }}:{{ radicale_port }}
          encode gzip zstd
          header {
              Strict-Transport-Security "max-age=31536000; includeSubDomains"
              X-Content-Type-Options nosniff
              X-Frame-Options DENY
              Referrer-Policy no-referrer
          }
      }
  notify: reload caddy

# -- SSH setup for radicale user (to push to git bare repo) --
- name: Ensure .ssh directory exists for radicale user
  file:
    path: "/var/lib/radicale/.ssh"
    state: directory
    owner: radicale
    group: radicale
    mode: '0700'

- name: Generate SSH key for radicale user
  openssh_keypair:
    path: "/var/lib/radicale/.ssh/id_ed25519"
    type: ed25519
    owner: radicale
    group: radicale
    comment: "radicale-backup@rammstein"

- name: Read radicale user's public key
  slurp:
    path: "/var/lib/radicale/.ssh/id_ed25519.pub"
  register: radicale_public_key

- name: Add radicale key to git user's authorized_keys
  authorized_key:
    user: git
    key: "{{ radicale_public_key['content'] | b64decode }}"
    state: present

- name: Add rammstein host key to radicale's known_hosts
  shell: "ssh-keyscan -H 10.66.0.1 >> /var/lib/radicale/.ssh/known_hosts"
  become_user: radicale
  changed_when: false

- name: Set known_hosts permissions
  file:
    path: "/var/lib/radicale/.ssh/known_hosts"
    owner: radicale
    group: radicale
    mode: '0600'

# -- Git backup via systemd timer --
- name: Ensure backup working copy directory exists
  file:
    path: "{{ radicale_git_backup_repo }}"
    state: directory
    owner: radicale
    group: radicale
    mode: '0750'

- name: Clone notes repo for calendar backup (if not already cloned)
  command: "git clone {{ radicale_git_remote }} {{ radicale_git_backup_repo }}"
  args:
    creates: "{{ radicale_git_backup_repo }}/.git"
  become_user: radicale
  ignore_errors: true

- name: Deploy calendar backup script
  template:
    src: backup-calendar.sh.j2
    dest: "{{ radicale_config_dir }}/backup-calendar.sh"
    owner: root
    group: radicale
    mode: '0750'

- name: Configure git identity for radicale user
  command: "git config --global {{ item.name }} {{ item.value }}"
  become_user: radicale
  loop:
    - { name: "user.name", value: "Radicale Backup" }
    - { name: "user.email", value: "radicale@rammstein" }
  changed_when: false

- name: Deploy calendar backup systemd service
  template:
    src: radicale-backup.service.j2
    dest: /etc/systemd/system/radicale-backup.service
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd for radicale-backup

- name: Deploy calendar backup systemd timer
  template:
    src: radicale-backup.timer.j2
    dest: /etc/systemd/system/radicale-backup.timer
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd for radicale-backup

- name: Enable and start calendar backup timer
  service:
    name: radicale-backup.timer
    state: started
    enabled: true
    daemon_reload: true