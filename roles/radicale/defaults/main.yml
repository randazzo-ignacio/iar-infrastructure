---
# roles/radicale/defaults/main.yml

# Radicale is a lightweight CalDAV/CardDAV server.
# Runs on rammstein, behind Caddy reverse proxy with TLS + basic auth.
# Phone and laptop connect via https://caldav.randazzo.ar

# -- Installation --
# Fedora packages Radicale 3 as 'radicale3' (not 'radicale')
radicale_package: "radicale3"

# -- Network --
# Bind to localhost only -- Caddy is the public entry point.
# Caddy proxies https://caldav.randazzo.ar -> localhost:5232
radicale_host: "127.0.0.1"
radicale_port: 5232

# -- Public domain for CalDAV (served by Caddy) --
radicale_domain: "caldav.randazzo.ar"

# -- Caddy config path (must match caddy role default) --
caddy_config_path: "/etc/caddy/Caddyfile"

# -- Data storage --
radicale_data_dir: "/var/lib/radicale/collections"
radicale_config_dir: "/etc/radicale"

# -- Authentication --
# Single user (Nacho). Password stored in vault as radicale_password.
# Radicale uses htpasswd-style file for basic auth.
radicale_username: "nacho"

# -- Git backup --
# Calendar data is backed up to the notes bare repo via systemd timer.
# A systemd timer runs daily at 3:00 AM, copies calendar data to a
# git working copy, commits, and pushes.
radicale_git_backup_repo: "/var/lib/radicale/backup"
radicale_git_remote: "git@10.66.0.1:/home/git/repos/notes.git"