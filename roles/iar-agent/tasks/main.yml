---
# roles/iar-agent/tasks/main.yml
# Deploys i.ar agent infrastructure on a host:
# - Clones i.ar, iar-personalization, and gptel fork repos
# - Builds the Podman container image
# - Installs systemd timers for configured agents
#
# Runs on: sophon (or any host with Podman + Ollama access)
# Requires: podman role (for Podman installation)

# ════════════════════════════════════════════════════════════
# 1. Repository setup
# ════════════════════════════════════════════════════════════

- name: Create repos directory
  file:
    path: "{{ iar_repo_dir | dirname }}"
    state: directory
    owner: "{{ local_ssh_user | default('nacho') }}"
    group: "{{ local_ssh_user | default('nacho') }}"
    mode: '0755'

- name: Clone i.ar repository
  git:
    repo: "{{ iar_repo_remote }}"
    dest: "{{ iar_repo_dir }}"
    version: main
    accept_hostkey: true
  become_user: "{{ local_ssh_user | default('nacho') }}"
  register: iar_repo_clone

- name: Clone iar-personalization repository
  git:
    repo: "{{ iar_personalization_remote }}"
    dest: "{{ iar_personalization_dir }}"
    version: main
    accept_hostkey: true
  become_user: "{{ local_ssh_user | default('nacho') }}"
  register: iar_personalization_clone

- name: Clone gptel fork repository
  git:
    repo: "{{ iar_gptel_fork_remote }}"
    dest: "{{ iar_gptel_fork_dir }}"
  become_user: "{{ local_ssh_user | default('nacho') }}"
  register: iar_gptel_clone

- name: Ensure iar.sh is executable
  file:
    path: "{{ iar_repo_dir }}/utils/iar.sh"
    mode: '0755'

- name: Deploy telegram.sh with credentials
  template:
    src: telegram.sh.j2
    dest: "{{ iar_repo_dir }}/utils/telegram.sh"
    owner: "{{ local_ssh_user | default('nacho') }}"
    group: "{{ local_ssh_user | default('nacho') }}"
    mode: '0644'

# ════════════════════════════════════════════════════════════
# 2. Personalization directory structure
# ════════════════════════════════════════════════════════════

- name: Ensure personalization subdirectories exist
  file:
    path: "{{ iar_personalization_dir }}/{{ item }}"
    state: directory
    owner: "{{ local_ssh_user | default('nacho') }}"
    group: "{{ local_ssh_user | default('nacho') }}"
    mode: '0755'
  loop:
    - knowledge
    - tasks
    - audit

- name: Ensure per-agent audit directories exist
  file:
    path: "{{ iar_personalization_dir }}/audit/{{ item.name }}"
    state: directory
    owner: "{{ local_ssh_user | default('nacho') }}"
    group: "{{ local_ssh_user | default('nacho') }}"
    mode: '0755'
  loop: "{{ iar_agents }}"

- name: Pre-create cycle.log files with correct ownership
  file:
    path: "{{ iar_personalization_dir }}/audit/{{ item.name }}/cycle.log"
    state: touch
    owner: "{{ local_ssh_user | default('nacho') }}"
    group: "{{ local_ssh_user | default('nacho') }}"
    mode: '0644'
  loop: "{{ iar_agents }}"

- name: Ensure per-agent task directories exist
  file:
    path: "{{ iar_personalization_dir }}/tasks/{{ item.name }}"
    state: directory
    owner: "{{ local_ssh_user | default('nacho') }}"
    group: "{{ local_ssh_user | default('nacho') }}"
    mode: '0755'
  loop: "{{ iar_agents }}"

# ════════════════════════════════════════════════════════════
# 3. Container image build
# ════════════════════════════════════════════════════════════

- name: Check if i.ar container image exists (as service user)
  command: podman image exists {{ iar_container_image }}
  become_user: "{{ local_ssh_user | default('nacho') }}"
  register: iar_image_check
  changed_when: false
  failed_when: false

- name: Build i.ar container image
  command: >
    {{ iar_repo_dir }}/containers/build.sh
  become_user: "{{ local_ssh_user | default('nacho') }}"
  when: iar_image_check.rc != 0
  environment:
    IMAGE_NAME: "{{ iar_container_image }}"

# ════════════════════════════════════════════════════════════
# 4. Systemd timers for agents
# ════════════════════════════════════════════════════════════

- name: Create systemd service units for agents
  template:
    src: iar-agent.service.j2
    dest: "/etc/systemd/system/iar-{{ item.name }}.service"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ iar_agents }}"

- name: Create systemd timer units for agents
  template:
    src: iar-agent.timer.j2
    dest: "/etc/systemd/system/iar-{{ item.name }}.timer"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ iar_agents }}"

- name: Reload systemd daemon
  systemd:
    daemon_reload: true

- name: Enable and start agent timers
  systemd:
    name: "iar-{{ item.name }}.timer"
    state: started
    enabled: true
  loop: "{{ iar_agents }}"