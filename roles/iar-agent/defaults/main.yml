---
# roles/iar-agent/defaults/main.yml
# i.ar agent infrastructure defaults.
# Override per-host in host_vars.

# ── Repository paths ───────────────────────────────────────
# Where to clone the i.ar repo and personalization repo.
# Must be absolute paths -- systemd does not expand ~user/.
# Default: /home/nacho (standard Fedora). Override in host_vars for
# Silverblue hosts where home is /var/home.
iar_repo_dir: "/home/nacho/repos/i.ar"
iar_personalization_dir: "/home/nacho/repos/iar-personalization"
iar_gptel_fork_dir: "/home/nacho/repos/gptel"

# ── Git remotes (emacboros forks) ───────────────────────────
iar_repo_remote: "git@github.com:emacboros/i.ar.git"
iar_personalization_remote: "git@github.com:emacboros/iar-personalization.git"
iar_gptel_fork_remote: "https://github.com/randazzo-ignacio/gptel.git"

# ── Ollama connection ──────────────────────────────────────
# Default to sophon's WireGuard IP with local GPU model.
# Override per-host if needed.
iar_ollama_host: "10.66.0.5:11434"
iar_model: "nemotron-3-super:120b"
iar_ctx: 131072

# ── Agent configuration ─────────────────────────────────────
# Which agents to deploy as systemd timers.
# Each entry: name, interval (systemd OnUnitActiveSec), timeout
iar_agents:
  - name: librarian
    interval: "30min"
    timeout: 3600

# ── Telegram notifications ─────────────────────────────────
# Credentials for agent Telegram notifications.
# Override in vault.yml -- do NOT commit real tokens.
iar_telegram_bot_token: "REPLACE_IN_VAULT"
iar_telegram_chat_id: "REPLACE_IN_VAULT"

# ── Container image ────────────────────────────────────────
iar_container_image: "iar-emacboros"
