---
# playbooks/wireguard.yml -- WireGuard mesh only (re-keying or topology changes).
# Usage: ansible-playbook playbooks/wireguard.yml --ask-vault-pass
#
# CRITICAL: The hub must be configured and restarted BEFORE any spokes.
# This is enforced with two plays: hub first (handlers flushed immediately),
# then spokes serially. Prevents spoke lockout when hub config changes.

- name: Configure WireGuard hub first (prevents spoke lockout)
  hosts: wg_hub
  become: true
  roles:
    - role: wireguard
      tags: [wireguard]

- name: Configure WireGuard spokes
  hosts: wg_peers
  serial: 1
  become: true
  roles:
    - role: wireguard
      when: inventory_hostname not in groups['wg_hub']
      tags: [wireguard]