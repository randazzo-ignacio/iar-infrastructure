---
# playbooks/portfolio-page.yml -- Deploy personal portfolio to rammstein.
# Usage: ansible-playbook playbooks/portfolio-page.yml --ask-vault-pass

- name: Deploy portfolio page
  hosts: web_servers
  become: true
  roles:
    - role: static-site
      vars:
        static_site_src: "portfolio"
        static_site_dest: "{{ portfolio_page_root }}"
      when: portfolio_page_enabled | default(false) | bool
      tags: [static-site]