---
# playbooks/site.yml -- Master playbook: runs all roles in order.
# Usage: ansible-playbook playbooks/site.yml --ask-vault-pass
#
# Consolidated 2026-08-04: daftpunk + greenday killed.
# Removed: ai_playground, monitoring, matrix, node-exporter groups.
# rammstein is sole VPS. sophon is local GPU + Frigate. yoga is daily driver.
#
# Git repos are discovered dynamically by scanning ~/repos/ on the
# Ansible control node (yoga). See playbooks/git-repos.yml for details.

- name: Base configuration (all hosts)
  hosts: all
  become: true
  roles:
    - role: base
      tags: [base]

- name: WireGuard mesh -- hub first (prevents spoke lockout)
  hosts: wg_hub
  become: true
  roles:
    - role: wireguard
      tags: [wireguard]

- name: WireGuard mesh -- spokes
  hosts: wg_peers
  serial: 1
  become: true
  roles:
    - role: wireguard
      when: inventory_hostname not in groups['wg_hub']
      tags: [wireguard]

- name: Caddy (web servers)
  hosts: web_servers
  become: true
  roles:
    - role: caddy
      tags: [caddy]

- name: Scan local repos directory for git repositories
  hosts: localhost
  connection: local
  tasks:
    - name: Scan ~/repos for git repositories
      shell: |
        for d in {{ lookup('env', 'HOME') }}/repos/*/; do
          if [ -d "${d}.git" ] || [ -f "${d}.git" ]; then
            basename "$d"
          fi
        done
      register: repo_scan
      changed_when: false

    - name: Set git_bare_repos fact from scan results
      set_fact:
        git_bare_repos: "{{ repo_scan.stdout_lines }}"

- name: Git bare repos (rammstein + sophon)
  hosts: rammstein, sophon
  become: true
  vars:
    git_bare_repos: "{{ hostvars['localhost']['git_bare_repos'] }}"
  roles:
    - role: git-repo
      tags: [git-repo]

- name: pass password manager (yoga only)
  hosts: yoga
  become: true
  roles:
    - role: pass
      tags: [pass]

- name: Restic backup (yoga + rammstein + sophon)
  hosts: rammstein, sophon, yoga
  become: true
  roles:
    - role: restic
      tags: [restic]

- name: Radicale CalDAV server (rammstein only)
  hosts: rammstein
  become: true
  roles:
    - role: radicale
      tags: [radicale]

- name: Wiki static site (rammstein only)
  hosts: rammstein
  become: true
  roles:
    - role: wiki
      tags: [wiki]

- name: Podman (all hosts)
  hosts: all
  become: true
  roles:
    - role: podman
      tags: [podman]

- name: NVIDIA GPU drivers (GPU hosts)
  hosts: gpu_hosts
  become: true
  roles:
    - role: nvidia
      tags: [nvidia]

- name: Ollama hosts
  hosts: ollama_hosts
  become: true
  roles:
    - role: ollama
      when: ollama_enabled | default(false) | bool
      tags: [ollama]

- name: Frigate NVR
  hosts: frigate_hosts
  become: true
  roles:
    - role: frigate
      when: frigate_enabled | default(false) | bool
      tags: [frigate]

- name: Static sites
  hosts: web_servers
  become: true
  roles:
    - role: static-site
      vars:
        static_site_src: "portfolio"
        static_site_dest: "{{ portfolio_page_root }}"
      when: portfolio_page_enabled | default(false) | bool
      tags: [static-site]
    - role: static-site
      vars:
        static_site_src: "landing"
        static_site_dest: "{{ static_page_root }}"
      when: tool_static_page_enabled | default(false) | bool
      tags: [static-site]

- name: i.ar Agent Infrastructure
  hosts: all
  become: true
  roles:
    - role: iar-agent
      when: iar_agents_enabled | default(false) | bool
      tags: [iar-agent]