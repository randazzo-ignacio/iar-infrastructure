---
# playbooks/monitoring.yml -- Deploy monitoring stack (Prometheus + Grafana).
# Usage: ansible-playbook playbooks/monitoring.yml --ask-vault-pass

- name: Node exporters (all hosts)
  hosts: all
  become: true
  roles:
    - role: node-exporter
      tags: [node-exporter]

- name: Monitoring stack (Prometheus + Grafana)
  hosts: monitoring
  become: true
  roles:
    - role: monitoring
      when: monitoring_enabled | default(false) | bool
      tags: [monitoring]