---
# playbooks/static-page.yml -- Deploy i.ar landing page to rammstein.
# Usage: ansible-playbook playbooks/static-page.yml --ask-vault-pass

- name: Deploy landing page
  hosts: web_servers
  become: true
  roles:
    - role: static-site
      vars:
        static_site_src: "landing"
        static_site_dest: "{{ static_page_root }}"
      when: tool_static_page_enabled | default(false) | bool
      tags: [static-site]